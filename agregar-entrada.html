<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGREGAR ENTRADA — Delirio</title><link rel="stylesheet" href="delirio.css"><style>.panel{max-width:1000px;margin:70px auto;background:#f8f7f5;padding:35px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin:0 0 18px}.field label{display:block;font:500 13px 'Fira Sans',sans-serif;letter-spacing:1.5px;margin-bottom:7px}.field input,.field select{width:100%;padding:11px;border:1px solid #545454;background:transparent;font:16px Benne,serif}.editor{border:1px solid #545454;background:#fff}.toolbar{padding:7px;border-bottom:1px solid #545454}.toolbar button{margin-right:5px;width:34px;height:30px;border:1px solid #aaa;background:transparent;cursor:pointer}.body{min-height:380px;padding:18px;outline:none;font:18px/1.65 Benne,serif}.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}.actions button{padding:12px 18px;border:0;background:#545454;color:#fff;cursor:pointer;font:600 12px 'Fira Sans',sans-serif;letter-spacing:1px}.actions .red{background:#af322f}.msg{margin-top:15px;font:15px 'Fira Sans',sans-serif}.preview{margin-top:35px;border-top:1px solid #545454;padding-top:25px}.pvtitle{font:35px Benne,serif}@media(max-width:700px){.grid{grid-template-columns:1fr}.panel{margin:25px 10px;padding:22px}}</style></head><body><div class="panel"><h1 class="section-heading">AGREGAR ENTRADA</h1><p>Panel de recepción y publicación de Delirio Digital</p><div class="field"><label>CONTRASEÑA</label><input id="pass" type="password"></div><button onclick="login()">INGRESAR</button><div id="app" style="display:none"><hr><div class="field"><label>ESCRITOS RECIBIDOS</label><select id="envio" onchange="loadSelected()"><option value="">Selecciona un escrito...</option></select></div><div class="grid"><div class="field"><label>AUTOR</label><input id="autor"></div><div class="field"><label>SECCIÓN</label><select id="seccion"><option></option><option>BLOG</option><option>POESÍA</option><option>NARRATIVA</option><option>CINE</option></select></div><div class="field"><label>BLOG</label><input id="blog"></div><div class="field"><label>TIPO</label><select id="tipo"><option></option><option>RESEÑA</option><option>CUENTO</option><option>OPINIÓN</option></select></div><div class="field"><label>TÍTULO</label><input id="titulo"></div><div class="field"><label>FECHA</label><input id="fecha"></div><div class="field"><label>NOMBRE DEL ARCHIVO</label><input id="archivo"></div></div><div class="field"><label>CONTENIDO</label><div class="editor"><div class="toolbar"><button onclick="cmd('bold')"><b>B</b></button><button onclick="cmd('italic')"><i>I</i></button></div><div id="contenido" class="body" contenteditable="true"></div></div></div><div class="actions"><button onclick="save()">GUARDAR CAMBIOS</button><button class="red" onclick="publish()">PUBLICAR</button></div><div id="msg" class="msg"></div><div class="preview"><h3>VISTA PREVIA</h3><div id="pv"><div id="pvsec"></div><div id="pva"></div><div id="pvtitle" class="pvtitle"></div><div id="pvdate"></div><div id="pvbody"></div></div></div></div></div><script>const API='https://script.google.com/macros/s/AKfycbwa81z9zejDZW-A4VdqPFUjrnRqL7Zx37TliHjn-AAlWE0dhFsC7iGcetDNdSOLgb9-/exec';const PASS='Revisión_delirio';let items=[],current=null;function login(){if(document.getElementById('pass').value!==PASS){msg('Contraseña incorrecta',1);return}document.getElementById('app').style.display='block';load()}async function load(){try{let r=await fetch(API+'?accion=pendientes');let d=await r.json();items=d.items||[];let s=document.getElementById('envio');items.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(x.titulo||'Sin título')+' — '+(x.autor||'Sin autor');s.appendChild(o)})}catch(e){msg('No se pudieron cargar los envíos',1)}}function loadSelected(){let i=document.getElementById('envio').value;if(i==='')return;current=items[+i];['autor','seccion','blog','tipo','titulo','fecha','archivo'].forEach(k=>document.getElementById(k).value=current[k]||'');document.getElementById('contenido').innerHTML=current.contenido||'';preview()}function cmd(c){document.getElementById('contenido').focus();document.execCommand(c,false,null);preview()}function data(action){return{accion:action,id:current?.id||'',autor:v('autor'),seccion:v('seccion'),blog:v('blog'),tipo:v('tipo'),titulo:v('titulo'),fecha:v('fecha'),archivo:v('archivo'),contenido:document.getElementById('contenido').innerHTML}}function v(id){return document.getElementById(id).value}async function send(x){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(x)});return r.json()}async function save(){if(!current)return msg('Selecciona un escrito',1);try{let d=await send(data('guardar'));msg(d.ok?'Cambios guardados':'No se pudo guardar',!d.ok)}catch(e){msg('Error de conexión',1)}}async function publish(){if(!current)return msg('Selecciona un escrito',1);if(!confirm('¿Publicar esta entrada?'))return;try{let d=await send(data('publicar'));msg(d.ok?'Entrada publicada correctamente':'No se pudo publicar',!d.ok);if(d.ok){current=null;document.getElementById('contenido').innerHTML='';load()}}catch(e){msg('Error de conexión',1)}}function msg(t,err){let m=document.getElementById('msg');m.textContent=t;m.style.color=err?'#af322f':'#545454'}function preview(){pvsec.textContent=v('seccion');pva.textContent=v('autor');pvtitle.textContent=v('titulo');pvdate.textContent=v('fecha');pvbody.innerHTML=document.getElementById('contenido').innerHTML}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',preview));document.getElementById('contenido').addEventListener('input',preview);</script></body></html>
